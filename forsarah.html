<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jasmine — for Sarah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --night-0:#060913;
    --night-1:#0b1124;
    --night-2:#111a36;
    --moon:#f4f1e4;
    --petal:#fffdf6;
    --gold:#e8d9a8;
    --ink:#dfe3f0;
    --ink-dim:#8b93ad;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(1200px 900px at 78% 12%, #1b2447 0%, transparent 55%),
      radial-gradient(900px 700px at 15% 85%, #0e1730 0%, transparent 60%),
      linear-gradient(180deg, var(--night-1) 0%, var(--night-0) 100%);
    color:var(--ink);
    font-family:"Cormorant Garamond", serif;
    cursor:grab;
    user-select:none;
    -webkit-user-select:none;
  }
  body.dragging{cursor:grabbing}

  #scene{position:fixed;inset:0;display:block}

  /* moon */
  .moon{
    position:fixed;
    top:7vh;right:9vw;
    width:110px;height:110px;
    border-radius:50%;
    background:radial-gradient(circle at 38% 35%, #fdfbef 0%, #ece5cc 55%, #d8d0b2 100%);
    box-shadow:
      0 0 40px 12px rgba(244,241,228,.25),
      0 0 140px 60px rgba(210,214,235,.12),
      0 0 320px 140px rgba(180,190,230,.07);
    z-index:1;
    animation:moonrise 3s ease-out both;
  }
  @keyframes moonrise{
    from{opacity:0;transform:translateY(26px)}
    to{opacity:1;transform:translateY(0)}
  }

  .star{
    position:fixed;
    border-radius:50%;
    background:#e9edff;
    z-index:1;
    animation:twinkle var(--tw,3s) ease-in-out infinite alternate;
    animation-delay:var(--td,0s);
  }
  @keyframes twinkle{
    from{opacity:.15;transform:scale(.8)}
    to{opacity:var(--to,.9);transform:scale(1)}
  }

  /* grain */
  .grain{
    position:fixed;inset:-50%;
    z-index:9;pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    opacity:.05;
    animation:grain 8s steps(10) infinite;
  }
  @keyframes grain{
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-3%,2%)}
    40%{transform:translate(2%,-3%)}
    60%{transform:translate(-2%,-2%)}
    80%{transform:translate(3%,3%)}
  }

  /* typography overlay */
  .frame{
    position:fixed;inset:0;
    z-index:5;pointer-events:none;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:clamp(24px,5vmin,56px);
  }
  .masthead{max-width:min(520px,80vw)}
  .masthead .over{
    font-size:clamp(11px,1.3vmin,14px);
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:.9em;
    animation:rise 1.4s .3s cubic-bezier(.2,.7,.2,1) both;
  }
  .masthead h1{
    font-family:Italiana, serif;
    font-weight:400;
    font-size:clamp(52px,9vmin,110px);
    line-height:.95;
    letter-spacing:.04em;
    color:var(--moon);
    text-shadow:0 0 60px rgba(244,241,228,.25);
    animation:rise 1.6s .55s cubic-bezier(.2,.7,.2,1) both;
  }
  .masthead .latin{
    margin-top:.9em;
    font-style:italic;
    font-size:clamp(15px,2vmin,20px);
    color:var(--ink-dim);
    letter-spacing:.06em;
    animation:rise 1.6s .8s cubic-bezier(.2,.7,.2,1) both;
  }
  .masthead .latin b{
    font-weight:500;
    color:var(--gold);
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(22px)}
    to{opacity:1;transform:translateY(0)}
  }

  .colophon{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
  }
  .verse{
    max-width:min(430px,70vw);
    font-style:italic;
    font-size:clamp(17px,2.3vmin,23px);
    line-height:1.5;
    color:var(--ink);
    animation:rise 1.8s 1.15s cubic-bezier(.2,.7,.2,1) both;
  }
  .verse .apology{
    display:block;
    margin-top:.7em;
    font-size:.85em;
    color:var(--gold);
  }
  .verse .dedication{
    display:block;
    margin-top:.7em;
    font-style:normal;
    font-size:.72em;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .hint{
    font-size:clamp(11px,1.3vmin,13px);
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--ink-dim);
    text-align:right;
    white-space:nowrap;
    animation:rise 1.8s 1.5s cubic-bezier(.2,.7,.2,1) both, pulse 4s 3s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.9}
    50%{opacity:.4}
  }

  @media (max-width:640px){
    .moon{width:72px;height:72px;top:5vh;right:7vw}
    .hint{display:none}
  }
</style>
</head>
<body>

<div class="moon"></div>
<canvas id="scene"></canvas>

<div class="frame">
  <header class="masthead">
    <div class="over">Night-blooming &middot; No. 1 of 1</div>
    <h1>Jasmine</h1>
    <div class="latin"><b>Jasminum sambac</b> — the flower that saves its sweetness for the dark.</div>
  </header>
  <footer class="colophon">
    <div class="verse">
      Some things bloom quietly,
      and change the whole night.
      <span class="apology">i'm sorry i slept in</span>
      <span class="dedication">for Sarah &#10087;</span>
    </div>
    <div class="hint">drag to turn &middot; tap to bloom</div>
  </footer>
</div>

<div class="grain"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ---------- stars ---------- */
{
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('span');
    s.className = 'star';
    const size = Math.random() < .85 ? Math.random() * 1.6 + .6 : Math.random() * 2.4 + 1.4;
    s.style.width = s.style.height = size.toFixed(1) + 'px';
    s.style.left = (Math.random() * 100).toFixed(2) + 'vw';
    s.style.top = (Math.random() * 72).toFixed(2) + 'vh';
    s.style.setProperty('--tw', (2 + Math.random() * 4).toFixed(2) + 's');
    s.style.setProperty('--td', (-Math.random() * 6).toFixed(2) + 's');
    s.style.setProperty('--to', (.4 + Math.random() * .55).toFixed(2));
    frag.appendChild(s);
  }
  document.body.appendChild(frag);
}

/* ---------- three setup ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();

const VIEW = 21;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, .1, 200);
function frameCamera() {
  const a = innerWidth / innerHeight;
  const v = a < 1 ? VIEW / Math.max(a, .45) * .9 : VIEW; /* keep plant framed on tall screens */
  camera.left = -v * a / 2; camera.right = v * a / 2;
  camera.top = v / 2; camera.bottom = -v / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
/* classic isometric angle */
camera.position.set(26, 26 * Math.tan(Math.asin(Math.tan(Math.PI / 6))), 26);
camera.position.y = 21;
camera.lookAt(0, 5.5, 0);
frameCamera();
addEventListener('resize', frameCamera);

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0x8fa3d9, 0x1a1430, .85));

const moonlight = new THREE.DirectionalLight(0xdfe6ff, 1.5);
moonlight.position.set(14, 24, 6);
moonlight.castShadow = true;
moonlight.shadow.mapSize.set(2048, 2048);
const sc = moonlight.shadow.camera;
sc.left = -16; sc.right = 16; sc.top = 20; sc.bottom = -12;
sc.near = 1; sc.far = 70;
moonlight.shadow.bias = -0.0004;
scene.add(moonlight);

const bloomGlow = new THREE.PointLight(0xfff2cf, 14, 16, 2);
bloomGlow.position.set(0, 13, 0);
scene.add(bloomGlow);

/* ---------- voxel model ---------- */
const vox = new Map(); // "x,y,z" -> color
const put = (x, y, z, c) => vox.set(`${Math.round(x)},${Math.round(y)},${Math.round(z)}`, c);

const C = {
  petal:  0xfffdf6,
  petalIn:0xfff2cf,
  pistil: 0xf5d76e,
  stem:   0x3f7a4c,
  stemD:  0x2e5c3a,
  leaf:   0x4c9159,
  leafD:  0x357044,
  sepal:  0x5aa863,
  grass:  0x3c7d4a,
  grassD: 0x2f6a3d,
  dirt:   0x5a4030,
  dirtD:  0x46311f,
  root:   0x3a2817,
};

/* floating earth island */
(() => {
  const R = 6.2;
  for (let x = -7; x <= 7; x++) for (let z = -7; z <= 7; z++) {
    const wob = Math.sin(x * 2.1) * .5 + Math.cos(z * 1.7) * .5;
    const d = Math.hypot(x, z) + wob * .35;
    if (d > R) continue;
    put(x, 0, z, (x + z * 3 + (x * z) % 3 + 300) % 5 < 2 ? C.grassD : C.grass);
    const depth = Math.max(1, Math.round(4.6 - d * .62 + wob * .6));
    for (let y = 1; y <= depth; y++)
      put(x, -y, z, y === depth && Math.random() < .6 ? C.root : (y > 2 ? C.dirtD : C.dirt));
  }
})();

/* stem path: gentle S-curve up to y=11 */
const stemAt = y => ({ x: Math.sin(y * .42) * 1.35, z: Math.cos(y * .3) * .7 - .7 });
for (let y = 1; y <= 11; y++) {
  const p = stemAt(y);
  put(p.x, y, p.z, y % 3 ? C.stem : C.stemD);
  if (y < 5) put(p.x + 1, y, p.z, C.stemD); /* thicker base */
}

/* leaves: paired ovate voxel leaves off the stem */
function leaf(y, dir) {
  const p = stemAt(y);
  for (let t = 1; t <= 4; t++) {
    const w = t === 1 || t === 4 ? 0 : 1;
    const lx = p.x + dir * t, lz = p.z + dir * t * .4;
    const ly = y + Math.floor(t / 3) - (t === 4 ? 0 : 0);
    for (let s = -w; s <= w; s++)
      put(lx + s * .7 * -dir, ly, lz + s, s === 0 ? C.leaf : C.leafD);
  }
}
leaf(3, 1); leaf(4, -1); leaf(6, 1); leaf(7, -1);

/* pinwheel blossom — 5 petals, jasmine-style */
function blossom(cx, cy, cz, scale, phase) {
  put(cx, cy, cz, C.pistil);
  put(cx, cy + (scale > .8 ? 1 : 0), cz, C.pistil);
  for (let p = 0; p < 5; p++) {
    const theta = p * Math.PI * 2 / 5 + phase;
    for (let t = 0; t <= 1.0001; t += .07) {
      const r = 1.4 + t * 4.6 * scale;
      const ang = theta + t * .85;             /* pinwheel twist */
      const w = Math.sin(Math.PI * Math.min(1, t * 1.12)) * 1.05 * scale;
      const py = cy + t * t * 1.6 - .15;        /* petals curl upward */
      for (let s = -1; s <= 1; s += .3) {
        const px = cx + Math.cos(ang) * r - Math.sin(ang) * s * w;
        const pz = cz + Math.sin(ang) * r + Math.cos(ang) * s * w;
        put(px, py, pz, t < .3 ? C.petalIn : C.petal);
      }
    }
  }
}

/* main crown blossom */
const top = stemAt(11);
blossom(top.x, 12, top.z, 1, .4);

/* side branch → smaller blossom */
(() => {
  const b = stemAt(6);
  const path = [[1, 0], [2, .6], [3, 1.4], [3.6, 2.2]];
  for (const [dx, dy] of path) put(b.x + dx, 6 + dy, b.z - dx * .5, C.stem);
  blossom(b.x + 4.4, 9, b.z - 2.4, .68, 1.7);
})();

/* side branch → closed bud */
(() => {
  const b = stemAt(8);
  const path = [[-1, .3], [-2, 1], [-2.8, 1.8]];
  for (const [dx, dy] of path) put(b.x + dx, 8 + dy, b.z + dx * -.4, C.stem);
  const bx = b.x - 3.4, bz = b.z + 1.5;
  put(bx, 10, bz, C.sepal);
  put(bx, 11, bz, C.petalIn);
  put(bx, 12, bz, C.petal);
  put(bx + (Math.random() < .5 ? 0 : 0), 13, bz, C.petal);
})();

/* build instanced mesh */
const plant = new THREE.Group();
scene.add(plant);

const geo = new THREE.BoxGeometry(.92, .92, .92);
const mat = new THREE.MeshStandardMaterial({ roughness: .85, metalness: 0 });
const mesh = new THREE.InstancedMesh(geo, mat, vox.size);
mesh.castShadow = mesh.receiveShadow = true;

{
  const m = new THREE.Matrix4();
  const col = new THREE.Color();
  let i = 0;
  for (const [key, c] of vox) {
    const [x, y, z] = key.split(',').map(Number);
    m.setPosition(x, y, z);
    mesh.setMatrixAt(i, m);
    /* subtle per-voxel value variation so faces read as handmade */
    col.setHex(c).offsetHSL(0, 0, (Math.random() - .5) * .045);
    mesh.setColorAt(i, col);
    i++;
  }
  mesh.instanceColor.needsUpdate = true;
}
plant.add(mesh);

/* ---------- fireflies ---------- */
const FLY_N = 34;
const flyGeo = new THREE.BufferGeometry();
const flyPos = new Float32Array(FLY_N * 3);
const flySeed = [];
for (let i = 0; i < FLY_N; i++) {
  flySeed.push({
    r: 5 + Math.random() * 9,
    a: Math.random() * Math.PI * 2,
    y: 1 + Math.random() * 13,
    sp: .1 + Math.random() * .35,
    ph: Math.random() * Math.PI * 2,
  });
}
flyGeo.setAttribute('position', new THREE.BufferAttribute(flyPos, 3));
const flyMat = new THREE.PointsMaterial({
  color: 0xffe9a0, size: .34, transparent: true, opacity: .9,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: false,
});
flyMat.size = 4 * Math.min(devicePixelRatio, 2);
const flies = new THREE.Points(flyGeo, flyMat);
scene.add(flies);

/* ---------- drifting petals ---------- */
const petalGeo = new THREE.BoxGeometry(.5, .12, .5);
const petalMat = new THREE.MeshStandardMaterial({
  color: 0xfffdf6, roughness: .7, transparent: true,
});
const PET_N = 26;
const petals = [];
const spawns = [
  () => [top.x, 12.5, top.z],
  () => [stemAt(6).x + 4.4, 9.3, stemAt(6).z - 2.4],
];
for (let i = 0; i < PET_N; i++) {
  const p = new THREE.Mesh(petalGeo, petalMat.clone());
  p.userData = { seed: Math.random() * 100, burst: null };
  resetPetal(p, true);
  plant.add(p);
  petals.push(p);
}
function resetPetal(p, scatter) {
  const [x, y, z] = spawns[Math.floor(Math.random() * spawns.length)]();
  p.position.set(
    x + (Math.random() - .5) * 4,
    scatter ? Math.random() * 14 : y,
    z + (Math.random() - .5) * 4
  );
  p.userData.vy = .012 + Math.random() * .02;
  p.userData.burst = null;
  p.material.opacity = 0;
}

/* click → burst of petals from the crown */
let burstQueue = 0;
addEventListener('pointerup', e => {
  if (dragMoved) return;
  burstQueue = 10;
});

/* ---------- interaction: drag to orbit ---------- */
let dragYaw = 0, targetYaw = 0, dragging = false, dragMoved = false, lastX = 0;
addEventListener('pointerdown', e => { dragging = true; dragMoved = false; lastX = e.clientX; document.body.classList.add('dragging'); });
addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  if (Math.abs(dx) > 2) dragMoved = true;
  targetYaw += dx * .008;
  lastX = e.clientX;
});
addEventListener('pointerup', () => { dragging = false; document.body.classList.remove('dragging'); });

/* ---------- animate ---------- */
const clock = new THREE.Clock();
let entrance = 0;

function tick() {
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta ? .016 : .016, .05);

  /* entrance: island floats up and settles */
  entrance = Math.min(1, entrance + .008);
  const ease = 1 - Math.pow(1 - entrance, 3);

  dragYaw += (targetYaw - dragYaw) * .07;
  plant.rotation.y = t * .12 + dragYaw;
  plant.position.y = (1 - ease) * -6 + Math.sin(t * .7) * .25;   /* idle hover */

  /* breathing glow */
  bloomGlow.intensity = 12 + Math.sin(t * 1.4) * 4;
  const g = new THREE.Vector3(top.x, 12.5, top.z).applyAxisAngle(new THREE.Vector3(0,1,0), plant.rotation.y);
  bloomGlow.position.set(g.x, 12.5 + plant.position.y, g.z);

  /* fireflies */
  for (let i = 0; i < FLY_N; i++) {
    const f = flySeed[i];
    const a = f.a + t * f.sp;
    flyPos[i * 3]     = Math.cos(a) * f.r + Math.sin(t * .9 + f.ph) * .8;
    flyPos[i * 3 + 1] = f.y + Math.sin(t * .6 + f.ph * 2) * 1.6;
    flyPos[i * 3 + 2] = Math.sin(a) * f.r + Math.cos(t * .7 + f.ph) * .8;
  }
  flyGeo.attributes.position.needsUpdate = true;
  flyMat.opacity = .55 + Math.sin(t * 2.2) * .35;

  /* petals: gentle fall + sway; bursts fly outward first */
  for (const p of petals) {
    const u = p.userData;
    if (burstQueue > 0 && p.material.opacity < .05) {
      const [x, y, z] = spawns[0]();
      p.position.set(x, y, z);
      const a = Math.random() * Math.PI * 2;
      u.burst = { vx: Math.cos(a) * .12, vz: Math.sin(a) * .12, vy: .1 + Math.random() * .08 };
      p.material.opacity = 1;
      burstQueue--;
    }
    if (u.burst) {
      p.position.x += u.burst.vx; p.position.z += u.burst.vz; p.position.y += u.burst.vy;
      u.burst.vy -= .006; u.burst.vx *= .97; u.burst.vz *= .97;
      if (u.burst.vy < -.02) u.burst = null;
    } else {
      p.position.y -= u.vy;
      p.position.x += Math.sin(t * 1.3 + u.seed) * .008;
      p.position.z += Math.cos(t * 1.1 + u.seed) * .008;
      p.material.opacity = Math.min(p.material.opacity + .02,
        p.position.y > 1.5 ? .95 : Math.max(0, (p.position.y + 3) / 4.5));
    }
    p.rotation.x += .01 + Math.sin(u.seed) * .008;
    p.rotation.z += .013;
    if (p.position.y < -4) resetPetal(p);
  }

  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
